<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 1150" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="2" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.12"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#374151"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <linearGradient id="startGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="taskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F4F6"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>
    <linearGradient id="decisionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="eraseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEE2E2"/>
      <stop offset="100%" stop-color="#FECACA"/>
    </linearGradient>
    <linearGradient id="provModeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="staModeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="890" height="60" rx="8" fill="#1E293B" filter="url(#shadow)"/>
  <text x="475" y="45" text-anchor="middle" fill="#F8FAFC" font-size="18" font-weight="bold">ผังงานการตัดสินใจช่วง Bootstrapping &amp; Reset Decision (ESP32 Wi-Fi Provisioning)</text>
  <text x="475" y="65" text-anchor="middle" fill="#94A3B8" font-size="13">ใบงานที่ 7.1: การศึกษากลไก Reset Provisioning 3 รูปแบบ และ NVS Forensics</text>

  <!-- Node 1: Start -->
  <rect x="365" y="105" width="220" height="46" rx="23" fill="url(#startGrad)" filter="url(#shadow)"/>
  <text x="475" y="133" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">⚡ เริ่มต้น app_main()</text>

  <!-- Line 1 -> Task -->
  <line x1="475" y1="151" x2="475" y2="175" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 1.5: Init LED Task -->
  <rect x="340" y="175" width="270" height="42" rx="6" fill="url(#taskGrad)" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="196" text-anchor="middle" fill="#1E293B" font-size="12" font-weight="600">xTaskCreate(led_status_task)</text>
  <text x="475" y="210" text-anchor="middle" fill="#64748B" font-size="11">สร้าง Background Task ควบคุม LED 1 (GPIO 2)</text>

  <!-- Line Task -> D1 -->
  <line x1="475" y1="217" x2="475" y2="245" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 1: GPIO 18 Button Check -->
  <polygon points="475,245 660,295 475,345 290,295" fill="url(#decisionGrad)" stroke="#D97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="285" text-anchor="middle" fill="#92400E" font-size="12" font-weight="bold">check_factory_reset_button()</text>
  <text x="475" y="302" text-anchor="middle" fill="#78350F" font-size="11">ตรวจสอบปุ่ม GPIO 18 (Active Low)</text>
  <text x="475" y="316" text-anchor="middle" fill="#78350F" font-size="11">ถูกกดค้างไว้ครบ 3 วินาทีหรือไม่?</text>

  <!-- D1 -> YES (Erase NVS by Button) -->
  <line x1="660" y1="295" x2="740" y2="295" stroke="#DC2626" stroke-width="2"/>
  <line x1="740" y1="295" x2="740" y2="335" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="690" y="288" fill="#DC2626" font-size="11" font-weight="bold">กดค้าง ≥ 3 วิ (YES)</text>

  <rect x="640" y="335" width="200" height="50" rx="6" fill="url(#eraseGrad)" stroke="#F87171" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="740" y="356" text-anchor="middle" fill="#991B1B" font-size="12" font-weight="bold">nvs_flash_erase()</text>
  <text x="740" y="372" text-anchor="middle" fill="#B91C1C" font-size="10">ล้าง NVS Flash ด้วยคำสั่งฮาร์ดแวร์ปุ่มกด</text>

  <line x1="740" y1="385" x2="740" y2="425" stroke="#DC2626" stroke-width="2"/>
  <line x1="740" y1="425" x2="550" y2="425" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- D1 -> NO -->
  <line x1="475" y1="345" x2="475" y2="400" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="485" y="375" fill="#059669" font-size="11" font-weight="bold">ไม่ได้กด (NO)</text>

  <!-- Node 2: nvs_flash_init() -->
  <rect x="360" y="400" width="230" height="48" rx="6" fill="url(#taskGrad)" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="422" text-anchor="middle" fill="#1E293B" font-size="13" font-weight="bold">ret = nvs_flash_init()</text>
  <text x="475" y="438" text-anchor="middle" fill="#64748B" font-size="11">เริ่มต้นเปิดใช้งาน NVS Partition (0x9000)</text>

  <!-- Line -> Decision 2 -->
  <line x1="475" y1="448" x2="475" y2="475" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 2: NVS Status Check -->
  <polygon points="475,475 660,520 475,565 290,520" fill="url(#decisionGrad)" stroke="#D97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="512" text-anchor="middle" fill="#92400E" font-size="11" font-weight="bold">ret == NO_FREE_PAGES หรือ</text>
  <text x="475" y="528" text-anchor="middle" fill="#78350F" font-size="11" font-weight="bold">ret == NEW_VERSION_FOUND?</text>

  <!-- D2 -> YES -->
  <line x1="660" y1="520" x2="740" y2="520" stroke="#DC2626" stroke-width="2"/>
  <line x1="740" y1="520" x2="740" y2="550" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="690" y="512" fill="#DC2626" font-size="11" font-weight="bold">จริง (YES)</text>

  <rect x="640" y="550" width="200" height="50" rx="6" fill="url(#eraseGrad)" stroke="#F87171" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="740" y="570" text-anchor="middle" fill="#991B1B" font-size="11" font-weight="bold">nvs_flash_erase()</text>
  <text x="740" y="586" text-anchor="middle" fill="#B91C1C" font-size="11">nvs_flash_init() ซ้ำ</text>

  <line x1="740" y1="600" x2="740" y2="635" stroke="#374151" stroke-width="2"/>
  <line x1="740" y1="635" x2="570" y2="635" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- D2 -> NO (OK) -->
  <line x1="475" y1="565" x2="475" y2="615" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="485" y="590" fill="#059669" font-size="11" font-weight="bold">ESP_OK (NO)</text>

  <!-- Node 3: Init Netif & Wi-Fi Core -->
  <rect x="330" y="615" width="290" height="50" rx="6" fill="url(#taskGrad)" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="635" text-anchor="middle" fill="#1E293B" font-size="12" font-weight="bold">esp_netif_init() &amp; esp_wifi_init()</text>
  <text x="475" y="652" text-anchor="middle" fill="#64748B" font-size="11">ลงทะเบียน Wi-Fi/IP Event Handlers (STA Events)</text>

  <!-- Line -> Decision 3 -->
  <line x1="475" y1="665" x2="475" y2="695" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 3: Menuconfig Flag -->
  <polygon points="475,695 660,740 475,785 290,740" fill="url(#decisionGrad)" stroke="#D97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="730" text-anchor="middle" fill="#92400E" font-size="12" font-weight="bold">#ifdef CONFIG_EXAMPLE_</text>
  <text x="475" y="746" text-anchor="middle" fill="#78350F" font-size="11" font-weight="bold">RESET_PROVISIONED ?</text>
  <text x="475" y="760" text-anchor="middle" fill="#B45309" font-size="10">(Build-time Firmware Flag)</text>

  <!-- D3 -> YES -->
  <line x1="660" y1="740" x2="740" y2="740" stroke="#DC2626" stroke-width="2"/>
  <line x1="740" y1="740" x2="740" y2="765" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="690" y="733" fill="#DC2626" font-size="11" font-weight="bold">เปิดใช้ (YES)</text>

  <rect x="630" y="765" width="220" height="50" rx="6" fill="url(#eraseGrad)" stroke="#F87171" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="740" y="785" text-anchor="middle" fill="#991B1B" font-size="11" font-weight="bold">wifi_prov_mgr_reset_</text>
  <text x="740" y="801" text-anchor="middle" fill="#991B1B" font-size="11" font-weight="bold">provisioning()</text>

  <line x1="740" y1="815" x2="740" y2="855" stroke="#374151" stroke-width="2"/>
  <line x1="740" y1="855" x2="570" y2="855" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- D3 -> NO -->
  <line x1="475" y1="785" x2="475" y2="835" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="485" y="810" fill="#059669" font-size="11" font-weight="bold">ปิดไว้ (NO)</text>

  <!-- Node 4: Prov Mgr Init & Check -->
  <rect x="330" y="835" width="290" height="46" rx="6" fill="url(#taskGrad)" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="854" text-anchor="middle" fill="#1E293B" font-size="12" font-weight="bold">wifi_prov_mgr_init(config)</text>
  <text x="475" y="870" text-anchor="middle" fill="#475569" font-size="11">wifi_prov_mgr_is_provisioned(&amp;provisioned)</text>

  <!-- Line -> Decision 4 -->
  <line x1="475" y1="881" x2="475" y2="905" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 4: Is Provisioned? -->
  <polygon points="475,905 630,945 475,985 320,945" fill="url(#decisionGrad)" stroke="#D97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="938" text-anchor="middle" fill="#92400E" font-size="12" font-weight="bold">provisioned == true ?</text>
  <text x="475" y="955" text-anchor="middle" fill="#78350F" font-size="11">(มีข้อมูล Wi-Fi ใน NVS?)</text>

  <!-- Branch Provisioned == false -->
  <line x1="320" y1="945" x2="220" y2="945" stroke="#2563EB" stroke-width="2"/>
  <line x1="220" y1="945" x2="220" y2="995" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="938" fill="#2563EB" font-size="11" font-weight="bold">false (ยังไม่มี)</text>

  <rect x="80" y="995" width="280" height="120" rx="8" fill="url(#provModeGrad)" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="1020" text-anchor="middle" fill="#1D4ED8" font-size="13" font-weight="bold">🔵 เข้าสู่โหมด Provisioning</text>
  <text x="220" y="1040" text-anchor="middle" fill="#1E3A8A" font-size="11">wifi_prov_mgr_start_provisioning()</text>
  <text x="220" y="1058" text-anchor="middle" fill="#475569" font-size="11">• ปล่อยสัญญาณ BLE / SoftAP</text>
  <text x="220" y="1074" text-anchor="middle" fill="#475569" font-size="11">• แสดง QR Code บน Serial Monitor</text>
  <text x="220" y="1092" text-anchor="middle" fill="#047857" font-size="11">💡 LED 1: ดับสนิท (LED_STA_OFF)</text>

  <!-- Branch Provisioned == true -->
  <line x1="630" y1="945" x2="730" y2="945" stroke="#059669" stroke-width="2"/>
  <line x1="730" y1="945" x2="730" y2="995" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="645" y="938" fill="#059669" font-size="11" font-weight="bold">true (มีข้อมูลเดิม)</text>

  <rect x="590" y="995" width="280" height="120" rx="8" fill="url(#staModeGrad)" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
  <text x="730" y="1020" text-anchor="middle" fill="#047857" font-size="13" font-weight="bold">🟢 เข้าสู่โหมด Wi-Fi Station</text>
  <text x="730" y="1040" text-anchor="middle" fill="#065F46" font-size="11">wifi_prov_mgr_deinit()</text>
  <text x="730" y="1058" text-anchor="middle" fill="#065F46" font-size="11">esp_wifi_set_mode(WIFI_MODE_STA)</text>
  <text x="730" y="1074" text-anchor="middle" fill="#065F46" font-size="11">esp_wifi_start() -&gt; esp_wifi_connect()</text>
  <text x="730" y="1092" text-anchor="middle" fill="#B45309" font-size="11">💡 LED 1: Alert -&gt; Heartbeat เมื่อได้ IP</text>
</svg>