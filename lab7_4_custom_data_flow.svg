<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="2" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="890" height="55" rx="8" fill="#1E293B" filter="url(#shadow)"/>
  <text x="475" y="44" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="bold">ผังการทำงานและการจัดการ Heap ของ Custom Data Handler</text>
  <text x="475" y="62" text-anchor="middle" fill="#94A3B8" font-size="12">Lifecycle of custom_prov_data_handler() &amp; Dynamic Memory Management in Protocomm</text>

  <!-- Step 1 -->
  <rect x="40" y="105" width="200" height="90" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="130" text-anchor="middle" fill="#1D4ED8" font-size="12" font-weight="bold">1. มือถือส่ง Custom Data</text>
  <text x="140" y="150" text-anchor="middle" fill="#475569" font-size="11">HTTP หรือ BLE Char ...FF55</text>
  <text x="140" y="168" text-anchor="middle" fill="#2563EB" font-size="11">"STUDENT_ID:65010099"</text>

  <line x1="240" y1="150" x2="270" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="270" y="105" width="200" height="90" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="370" y="130" text-anchor="middle" fill="#B45309" font-size="12" font-weight="bold">2. Protocomm Layer</text>
  <text x="370" y="150" text-anchor="middle" fill="#475569" font-size="11">ถอดรหัส AES-CTR</text>
  <text x="370" y="168" text-anchor="middle" fill="#92400E" font-size="11">เรียก Callback Handler</text>

  <line x1="470" y1="150" x2="500" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="500" y="105" width="200" height="90" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="130" text-anchor="middle" fill="#047857" font-size="12" font-weight="bold">3. custom_prov_handler</text>
  <text x="600" y="150" text-anchor="middle" fill="#475569" font-size="11">ESP_LOGI(...) ข้อมูลเข้า</text>
  <text x="600" y="168" text-anchor="middle" fill="#065F46" font-size="11">*outbuf = strdup("ACK...")</text>

  <line x1="700" y1="150" x2="730" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="730" y="105" width="180" height="90" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="820" y="130" text-anchor="middle" fill="#1D4ED8" font-size="12" font-weight="bold">4. ส่งผลตอบกลับ</text>
  <text x="820" y="150" text-anchor="middle" fill="#475569" font-size="11">Protocomm เข้ารหัส</text>
  <text x="820" y="168" text-anchor="middle" fill="#2563EB" font-size="11">ส่ง payload กลับหามือถือ</text>

  <!-- Step 4 -> Down to Free -->
  <line x1="820" y1="195" x2="820" y2="245" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Free Heap -->
  <rect x="30" y="245" width="890" height="90" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="272" text-anchor="middle" fill="#B91C1C" font-size="13" font-weight="bold">5. ทำไมต้องจัดสรรบน Heap ด้วย strdup() / malloc() ?</text>
  <text x="475" y="295" text-anchor="middle" fill="#7F1D1D" font-size="11">• เมื่อออกจากฟังก์ชัน Stack Frame จะถูกทำลาย Local Variable ใน Stack จะกลายเป็น Dangling Pointer ทันที</text>
  <text x="475" y="315" text-anchor="middle" fill="#047857" font-size="11" font-weight="bold">• Protocomm Framework จะรับผิดชอบเรียก free(*outbuf) ทันทีหลังส่งข้อมูลกลับให้ Client เสร็จสิ้น ป้องกัน Memory Leak!</text>

  <!-- Summary Card -->
  <rect x="30" y="355" width="890" height="155" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="380" fill="#334155" font-size="13" font-weight="bold">📌 สรุปกรณีการใช้งาน Custom Endpoint ในผลิตภัณฑ์จริง (Commercial IoT Use Cases):</text>
  <text x="50" y="405" fill="#475569" font-size="11">1. Device Activation &amp; Cloud Token: ส่ง Cloud API Key, MQTT Username/Token หรือ User ID เพื่อผูกบอร์ดกับบัญชีผู้ใช้</text>
  <text x="50" y="425" fill="#475569" font-size="11">2. Timezone &amp; Geolocation Setup: ส่งค่า Timezone (เช่น "Asia/Bangkok") หรือพิกัด GPS เพื่อให้ ESP32 ตั้งเวลาและคอนฟิก NTP</text>
  <text x="50" y="445" fill="#475569" font-size="11">3. Device Pairing / Ownership Claim: รับ Certificate หรือ Public Key ของสมาร์ตโฟนเจ้าของเพื่อลงทะเบียนเป็น Admin ประจำบอร์ด</text>
  <text x="50" y="465" fill="#475569" font-size="11">4. Custom Hardware Configuration: ตั้งชื่ออุปกรณ์ (Friendly Name เช่น "Bedroom Light") หรือค่า Room ID ก่อนเริ่มทำงาน</text>
</svg>