<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 820" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="2" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#374151"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="890" height="55" rx="8" fill="#1E293B" filter="url(#shadow)"/>
  <text x="475" y="44" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="bold">ผังลำดับการสื่อสารผ่าน HTTP Endpoints (SoftAP Scheme Sequence Flow)</text>
  <text x="475" y="62" text-anchor="middle" fill="#94A3B8" font-size="12">ใบงานที่ 7.2: การคอนฟิก Wi-Fi ผ่าน SoftAP Scheme และการวิเคราะห์ Protocomm Endpoints</text>

  <!-- Lifeline Columns -->
  <!-- Actor 1: Smartphone App -->
  <rect x="70" y="95" width="200" height="45" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="117" text-anchor="middle" fill="#1D4ED8" font-size="13" font-weight="bold">📱 Smartphone App</text>
  <text x="170" y="132" text-anchor="middle" fill="#60A5FA" font-size="11">ESP SoftAP Prov (Client)</text>
  <line x1="170" y1="140" x2="170" y2="760" stroke="#94A3B8" stroke-dasharray="4,4" stroke-width="1.5"/>

  <!-- Actor 2: ESP32 SoftAP -->
  <rect x="375" y="95" width="200" height="45" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="117" text-anchor="middle" fill="#B45309" font-size="13" font-weight="bold">⚡ ESP32 SoftAP Webserver</text>
  <text x="475" y="132" text-anchor="middle" fill="#D97706" font-size="11">Protocomm HTTP (192.168.4.1)</text>
  <line x1="475" y1="140" x2="475" y2="760" stroke="#94A3B8" stroke-dasharray="4,4" stroke-width="1.5"/>

  <!-- Actor 3: Router AP -->
  <rect x="680" y="95" width="200" height="45" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="117" text-anchor="middle" fill="#047857" font-size="13" font-weight="bold">📡 Wi-Fi Router (AP)</text>
  <text x="780" y="132" text-anchor="middle" fill="#059669" font-size="11">เป้าหมายเชื่อมต่ออินเทอร์เน็ต</text>
  <line x1="780" y1="140" x2="780" y2="760" stroke="#94A3B8" stroke-dasharray="4,4" stroke-width="1.5"/>

  <!-- Step 0: ESP32 starts SoftAP -->
  <rect x="360" y="155" width="230" height="42" rx="4" fill="#FDE68A" stroke="#D97706" stroke-width="1"/>
  <text x="475" y="172" text-anchor="middle" fill="#92400E" font-size="11" font-weight="bold">WIFI_PROV_START</text>
  <text x="475" y="188" text-anchor="middle" fill="#78350F" font-size="10">ปล่อย SSID: PROV_XXXXXX | LED 3 ติด (1)</text>

  <!-- Step 1: Wi-Fi Connect -->
  <line x1="170" y1="220" x2="475" y2="220" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="320" y="213" text-anchor="middle" fill="#1D4ED8" font-size="11" font-weight="bold">1. มือถือเชื่อมต่อ Wi-Fi "PROV_XXXXXX" (192.168.4.2)</text>

  <rect x="360" y="230" width="230" height="30" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="475" y="250" text-anchor="middle" fill="#92400E" font-size="11">WIFI_EVENT_AP_STACONNECTED</text>

  <!-- Step 2: Session Setup -->
  <line x1="170" y1="285" x2="475" y2="285" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="320" y="278" text-anchor="middle" fill="#1D4ED8" font-size="11" font-weight="bold">2. HTTP POST /prov-session (Curve25519 Pk + PoP: abcd1234)</text>

  <rect x="360" y="295" width="230" height="30" rx="4" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
  <text x="475" y="315" text-anchor="middle" fill="#065F46" font-size="11">PROTOCOMM_SECURITY_SESSION_SETUP_OK</text>

  <line x1="475" y1="345" x2="170" y2="345" stroke="#059669" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
  <text x="320" y="338" text-anchor="middle" fill="#047857" font-size="11">HTTP 200 OK (Secured AES Session Ready)</text>

  <!-- Step 3: Scan APs -->
  <line x1="170" y1="385" x2="475" y2="385" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="320" y="378" text-anchor="middle" fill="#1D4ED8" font-size="11" font-weight="bold">3. HTTP POST /prov-scan (ร้องขอสแกนหา Wi-Fi APs)</text>

  <line x1="475" y1="415" x2="170" y2="415" stroke="#059669" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
  <text x="320" y="408" text-anchor="middle" fill="#047857" font-size="11">HTTP 200 OK (ส่งรายการ SSID + RSSI)</text>

  <!-- Step 4: Send Credentials -->
  <line x1="170" y1="460" x2="475" y2="460" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="320" y="453" text-anchor="middle" fill="#1D4ED8" font-size="11" font-weight="bold">4. HTTP POST /prov-config (ส่ง SSID เป้าหมาย + Password)</text>

  <rect x="360" y="475" width="230" height="30" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="475" y="495" text-anchor="middle" fill="#92400E" font-size="11">WIFI_PROV_CRED_RECV (แกะรหัสผ่าน)</text>

  <!-- Step 5: Connect Router -->
  <line x1="475" y1="525" x2="780" y2="525" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="630" y="518" text-anchor="middle" fill="#1E293B" font-size="11" font-weight="bold">5. ESP32 พยายามเชื่อมต่อไปยัง Router AP</text>

  <line x1="780" y1="565" x2="475" y2="565" stroke="#059669" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
  <text x="630" y="558" text-anchor="middle" fill="#047857" font-size="11">DHCP Offer: จ่าย IP Address ให้ ESP32</text>

  <rect x="360" y="580" width="230" height="42" rx="4" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
  <text x="475" y="598" text-anchor="middle" fill="#065F46" font-size="11" font-weight="bold">IP_EVENT_STA_GOT_IP</text>
  <text x="475" y="614" text-anchor="middle" fill="#047857" font-size="10">LED 1 (STA) ติดสว่าง (1)</text>

  <!-- Step 6: Success -->
  <rect x="360" y="635" width="230" height="30" rx="4" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
  <text x="475" y="655" text-anchor="middle" fill="#065F46" font-size="11">WIFI_PROV_CRED_SUCCESS</text>

  <line x1="475" y1="685" x2="170" y2="685" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="320" y="678" text-anchor="middle" fill="#047857" font-size="11" font-weight="bold">6. HTTP 200 OK (Provisioning Successful!)</text>

  <!-- Step 7: Cleanup -->
  <rect x="360" y="705" width="230" height="42" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="475" y="722" text-anchor="middle" fill="#1D4ED8" font-size="11" font-weight="bold">WIFI_PROV_END</text>
  <text x="475" y="738" text-anchor="middle" fill="#1E3A8A" font-size="10">ปิด SoftAP, LED 3 ดับ (0), wifi_prov_mgr_deinit()</text>
</svg>