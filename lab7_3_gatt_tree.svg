<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="2" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="890" height="55" rx="8" fill="#1E293B" filter="url(#shadow)"/>
  <text x="475" y="44" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="bold">ผังโครงสร้าง GATT Tree &amp; Protocomm Endpoint Mapping (BLE Scheme)</text>
  <text x="475" y="62" text-anchor="middle" fill="#94A3B8" font-size="12">ใบงานที่ 7.3: การคอนฟิก Wi-Fi ผ่าน BLE Scheme และการสืบสวน GATT Services</text>

  <!-- Device Node (Root) -->
  <rect x="325" y="95" width="300" height="50" rx="8" fill="#1E3A8A" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="116" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">ESP32 BLE Device (Advertising)</text>
  <text x="475" y="133" text-anchor="middle" fill="#93C5FD" font-size="11">Name: PROV_XXXXXX (ตาม MAC Address)</text>

  <!-- Line to Primary Service -->
  <line x1="475" y1="145" x2="475" y2="175" stroke="#374151" stroke-width="2"/>

  <!-- Primary Service Node -->
  <rect x="225" y="175" width="500" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="196" text-anchor="middle" fill="#1D4ED8" font-size="13" font-weight="bold">GATT Primary Service</text>
  <text x="475" y="214" text-anchor="middle" fill="#1E40AF" font-size="11">Custom 128-bit UUID: 021a9004-0382-4aea-bff4-6b3f1c5adfb4</text>

  <!-- Lines from Service to 5 Characteristics -->
  <line x1="475" y1="227" x2="475" y2="255" stroke="#374151" stroke-width="2"/>
  <line x1="110" y1="255" x2="840" y2="255" stroke="#374151" stroke-width="2"/>

  <!-- Drops to each Characteristic -->
  <line x1="110" y1="255" x2="110" y2="280" stroke="#374151" stroke-width="2"/>
  <line x1="292" y1="255" x2="292" y2="280" stroke="#374151" stroke-width="2"/>
  <line x1="475" y1="255" x2="475" y2="280" stroke="#374151" stroke-width="2"/>
  <line x1="657" y1="255" x2="657" y2="280" stroke="#374151" stroke-width="2"/>
  <line x1="840" y1="255" x2="840" y2="280" stroke="#374151" stroke-width="2"/>

  <!-- Char 1: prov-session -->
  <rect x="25" y="280" width="170" height="110" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="302" text-anchor="middle" fill="#B45309" font-size="12" font-weight="bold">Characteristic 1</text>
  <text x="110" y="320" text-anchor="middle" fill="#92400E" font-size="11">UUID: ...FF51</text>
  <text x="110" y="338" text-anchor="middle" fill="#78350F" font-size="10">Properties: Read / Write</text>
  <rect x="35" y="350" width="150" height="30" rx="4" fill="#FDE68A"/>
  <text x="110" y="369" text-anchor="middle" fill="#78350F" font-size="10" font-weight="bold">0x2901: "prov-session"</text>

  <!-- Char 2: prov-config -->
  <rect x="207" y="280" width="170" height="110" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="292" y="302" text-anchor="middle" fill="#B45309" font-size="12" font-weight="bold">Characteristic 2</text>
  <text x="292" y="320" text-anchor="middle" fill="#92400E" font-size="11">UUID: ...FF52</text>
  <text x="292" y="338" text-anchor="middle" fill="#78350F" font-size="10">Properties: Read / Write</text>
  <rect x="217" y="350" width="150" height="30" rx="4" fill="#FDE68A"/>
  <text x="292" y="369" text-anchor="middle" fill="#78350F" font-size="10" font-weight="bold">0x2901: "prov-config"</text>

  <!-- Char 3: prov-scan -->
  <rect x="390" y="280" width="170" height="110" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="302" text-anchor="middle" fill="#B45309" font-size="12" font-weight="bold">Characteristic 3</text>
  <text x="475" y="320" text-anchor="middle" fill="#92400E" font-size="11">UUID: ...FF53</text>
  <text x="475" y="338" text-anchor="middle" fill="#78350F" font-size="10">Properties: Read / Write</text>
  <rect x="400" y="350" width="150" height="30" rx="4" fill="#FDE68A"/>
  <text x="475" y="369" text-anchor="middle" fill="#78350F" font-size="10" font-weight="bold">0x2901: "prov-scan"</text>

  <!-- Char 4: proto-ver -->
  <rect x="572" y="280" width="170" height="110" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="657" y="302" text-anchor="middle" fill="#B45309" font-size="12" font-weight="bold">Characteristic 4</text>
  <text x="657" y="320" text-anchor="middle" fill="#92400E" font-size="11">UUID: ...FF54</text>
  <text x="657" y="338" text-anchor="middle" fill="#78350F" font-size="10">Properties: Read</text>
  <rect x="582" y="350" width="150" height="30" rx="4" fill="#FDE68A"/>
  <text x="657" y="369" text-anchor="middle" fill="#78350F" font-size="10" font-weight="bold">0x2901: "proto-ver"</text>

  <!-- Char 5: custom-data -->
  <rect x="755" y="280" width="170" height="110" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="840" y="302" text-anchor="middle" fill="#B45309" font-size="12" font-weight="bold">Characteristic 5</text>
  <text x="840" y="320" text-anchor="middle" fill="#92400E" font-size="11">UUID: ...FF55</text>
  <text x="840" y="338" text-anchor="middle" fill="#78350F" font-size="10">Properties: Read / Write</text>
  <rect x="765" y="350" width="150" height="30" rx="4" fill="#FDE68A"/>
  <text x="840" y="369" text-anchor="middle" fill="#78350F" font-size="10" font-weight="bold">0x2901: "custom-data"</text>

  <!-- Explanation card below -->
  <rect x="30" y="420" width="890" height="110" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="445" fill="#334155" font-size="13" font-weight="bold">💡 บทบาทของ Descriptor 0x2901 (User Characteristic Description):</text>
  <text x="50" y="468" fill="#475569" font-size="11">• เนื่องจาก 128-bit UUID เป็นตัวเลขฐานสิบหกยาว Protocomm จึงแนบ Descriptor 0x2901 เพื่อระบุชื่อ Endpoint (String Text)</text>
  <text x="50" y="488" fill="#475569" font-size="11">• แอปมือถือ (ESP BLE Prov) จะอ่าน Descriptor 0x2901 เพื่อจับคู่ว่า Endpoint ใดคือ "prov-session" (ทำ Handshake) หรือ "prov-config" (ส่ง Wi-Fi)</text>
  <text x="50" y="508" fill="#475569" font-size="11">• สถาปัตยกรรมนี้ทำให้สามารถเพิ่ม Endpoint ใหม่ เช่น "custom-data" ได้อย่างยืดหยุ่นโดยไม่ต้องฮาร์ดโค้ด UUID ฝั่งแอปพลิเคชัน</text>
</svg>