<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 640" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="2" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="890" height="55" rx="8" fill="#1E293B" filter="url(#shadow)"/>
  <text x="475" y="44" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="bold">ผังวงจรชีวิต BLE และการคืนหน่วยความจำ Bluetooth (Memory Reclaim Lifecycle)</text>
  <text x="475" y="62" text-anchor="middle" fill="#94A3B8" font-size="12">Release BTDM / NimBLE Memory to Internal Heap (~50KB - 70KB DRAM Reclaimed)</text>

  <!-- Step 1: Start BLE -->
  <rect x="50" y="105" width="250" height="90" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="175" y="130" text-anchor="middle" fill="#1D4ED8" font-size="12" font-weight="bold">1. เริ่มกระจายสัญญาณ BLE</text>
  <text x="175" y="148" text-anchor="middle" fill="#2563EB" font-size="11">WIFI_PROV_START</text>
  <text x="175" y="166" text-anchor="middle" fill="#475569" font-size="11">• BT Controller ใช้ RAM ~60KB</text>
  <text x="175" y="182" text-anchor="middle" fill="#047857" font-size="11">• LED 2 (GPIO 4): ติดสว่าง (1)</text>

  <line x1="300" y1="150" x2="350" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Client Connected -->
  <rect x="350" y="105" width="250" height="90" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="130" text-anchor="middle" fill="#B45309" font-size="12" font-weight="bold">2. มือถือต่อ GATT เข้ามา</text>
  <text x="475" y="148" text-anchor="middle" fill="#92400E" font-size="11">PROTOCOMM_BLE_CONNECTED</text>
  <text x="475" y="166" text-anchor="middle" fill="#475569" font-size="11">• แลกเปลี่ยนคีย์ &amp; รับ Wi-Fi</text>
  <text x="475" y="182" text-anchor="middle" fill="#B45309" font-size="11">• LED 2: กระพริบเร็วรับข้อมูล</text>

  <line x1="600" y1="150" x2="650" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Wi-Fi Success -->
  <rect x="650" y="105" width="250" height="90" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="775" y="130" text-anchor="middle" fill="#047857" font-size="12" font-weight="bold">3. เชื่อมต่อ Wi-Fi สำเร็จ</text>
  <text x="775" y="148" text-anchor="middle" fill="#065F46" font-size="11">WIFI_PROV_CRED_SUCCESS</text>
  <text x="775" y="166" text-anchor="middle" fill="#475569" font-size="11">• บันทึก Wi-Fi ลงใน NVS</text>
  <text x="775" y="182" text-anchor="middle" fill="#DC2626" font-size="11">• ปิด LED 2 (GPIO 4 = 0)</text>

  <!-- Step 3 -> Step 4 Downward -->
  <line x1="775" y1="195" x2="775" y2="245" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: De-init & End -->
  <rect x="650" y="245" width="250" height="90" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="775" y="270" text-anchor="middle" fill="#1D4ED8" font-size="12" font-weight="bold">4. จบภารกิจ Provisioning</text>
  <text x="775" y="288" text-anchor="middle" fill="#2563EB" font-size="11">WIFI_PROV_END</text>
  <text x="775" y="306" text-anchor="middle" fill="#475569" font-size="11">เรียก wifi_prov_mgr_deinit()</text>
  <text x="775" y="322" text-anchor="middle" fill="#475569" font-size="11">ยุติ GATT Server และ BLE Stack</text>

  <line x1="650" y1="290" x2="600" y2="290" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Memory Reclaim Core -->
  <rect x="220" y="235" width="380" height="110" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="260" text-anchor="middle" fill="#B91C1C" font-size="13" font-weight="bold">5. ปลดปล่อยหน่วยความจำ (esp_bt_mem_release)</text>
  <text x="410" y="282" text-anchor="middle" fill="#991B1B" font-size="11">Log: wifi_prov_scheme_ble: BT memory released</text>
  <text x="410" y="300" text-anchor="middle" fill="#991B1B" font-size="11">Log: wifi_prov_scheme_ble: BTDM memory released</text>
  <text x="410" y="324" text-anchor="middle" fill="#047857" font-size="11" font-weight="bold">🎉 คืนหน่วยความจำ DRAM ~50KB - 70KB กลับสู่ระบบ!</text>

  <line x1="220" y1="290" x2="175" y2="290" stroke="#374151" stroke-width="2"/>
  <line x1="175" y1="290" x2="175" y2="380" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6: Normal IoT Operation -->
  <rect x="50" y="380" width="850" height="120" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="408" text-anchor="middle" fill="#047857" font-size="14" font-weight="bold">6. เข้าสู่โหมด Wi-Fi Station ทั่วไป (Full Heap Available for MQTT / TLS / App)</text>
  <text x="475" y="432" text-anchor="middle" fill="#065F46" font-size="12">Event: IP_EVENT_STA_GOT_IP -&gt; LED 1 (GPIO 2) ติดสว่างสมบูรณ์</text>
  <text x="475" y="454" text-anchor="middle" fill="#334155" font-size="11">• แอปพลิเคชันมีหน่วยความจำ Heap เพียงพอสำหรับการต่อ MQTT TLS / HTTPS / JSON Processing</text>
  <text x="475" y="474" text-anchor="middle" fill="#334155" font-size="11">• ไม่สิ้นเปลือง RAM สำหรับ Bluetooth Controller อีกต่อไปหลังจากหมดความจำเป็น</text>
</svg>