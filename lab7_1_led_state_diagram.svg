<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="2" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.12"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#374151"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="840" height="55" rx="8" fill="#1E293B" filter="url(#shadow)"/>
  <text x="450" y="44" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="bold">ผังสถานะการเปลี่ยนจังหวะไฟ LED 1 (GPIO 2): Wi-Fi STA Indicator</text>
  <text x="450" y="62" text-anchor="middle" fill="#94A3B8" font-size="12">State Diagram &amp; Event-Driven Transitions in FreeRTOS Task</text>

  <!-- Initial pseudo state -->
  <circle cx="80" cy="200" r="14" fill="#4B5563"/>
  <line x1="94" y1="200" x2="140" y2="200" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="117" y="190" text-anchor="middle" fill="#6B7280" font-size="11">Power ON</text>

  <!-- State 1: LED_STA_OFF -->
  <rect x="140" y="145" width="190" height="110" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2" filter="url(#shadow)"/>
  <rect x="140" y="145" width="190" height="32" rx="10" fill="#E5E7EB"/>
  <text x="235" y="166" text-anchor="middle" fill="#1F2937" font-size="13" font-weight="bold">LED_STA_OFF</text>
  <text x="235" y="195" text-anchor="middle" fill="#4B5563" font-size="11">• ดับสนิท (Logic 0 / 0V)</text>
  <text x="235" y="213" text-anchor="middle" fill="#4B5563" font-size="11">• ช่วง Bootstrapping</text>
  <text x="235" y="231" text-anchor="middle" fill="#4B5563" font-size="11">• หรืออยู่ในโหมด Provisioning</text>

  <!-- Transition: OFF -> DISCONNECTED -->
  <line x1="330" y1="200" x2="400" y2="200" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="365" y="178" text-anchor="middle" fill="#1D4ED8" font-size="10" font-weight="bold">WIFI_EVENT_</text>
  <text x="365" y="192" text-anchor="middle" fill="#1D4ED8" font-size="10" font-weight="bold">STA_START</text>

  <!-- State 2: LED_STA_DISCONNECTED -->
  <rect x="400" y="130" width="220" height="140" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
  <rect x="400" y="130" width="220" height="34" rx="10" fill="#FDE68A"/>
  <text x="510" y="152" text-anchor="middle" fill="#92400E" font-size="13" font-weight="bold">LED_STA_DISCONNECTED</text>
  <text x="510" y="180" text-anchor="middle" fill="#B45309" font-size="11" font-weight="bold">⚠️ Alert Pattern (กระพริบเร็ว)</text>
  <text x="510" y="198" text-anchor="middle" fill="#78350F" font-size="11">• ติด 200ms / ดับ 200ms (คาบ 400ms)</text>
  <text x="510" y="218" text-anchor="middle" fill="#78350F" font-size="11">ความหมาย: กำลังเชื่อมต่อ AP หรือ</text>
  <text x="510" y="236" text-anchor="middle" fill="#78350F" font-size="11">สัญญาณ Wi-Fi หลุด (Reconnecting)</text>

  <!-- Transition: DISCONNECTED -> CONNECTED (Forward) -->
  <path d="M 620 180 Q 665 160 700 180" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="660" y="145" text-anchor="middle" fill="#047857" font-size="10" font-weight="bold">IP_EVENT_</text>
  <text x="660" y="159" text-anchor="middle" fill="#047857" font-size="10" font-weight="bold">STA_GOT_IP</text>

  <!-- State 3: LED_STA_CONNECTED -->
  <rect x="700" y="130" width="180" height="140" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="700" y="130" width="180" height="34" rx="10" fill="#D1FAE5"/>
  <text x="790" y="152" text-anchor="middle" fill="#065F46" font-size="13" font-weight="bold">LED_STA_CONNECTED</text>
  <text x="790" y="180" text-anchor="middle" fill="#047857" font-size="11" font-weight="bold">💓 Heartbeat Pattern</text>
  <text x="790" y="198" text-anchor="middle" fill="#065F46" font-size="11">• ติด 200ms / ดับ 800ms</text>
  <text x="790" y="216" text-anchor="middle" fill="#065F46" font-size="11">  (กระพริบ 1 ครั้งทุกๆ 1 วินาที)</text>
  <text x="790" y="236" text-anchor="middle" fill="#065F46" font-size="11">ความหมาย: เชื่อมต่อสำเร็จ (ONLINE)</text>

  <!-- Transition: CONNECTED -> DISCONNECTED (Return) -->
  <path d="M 700 225 Q 665 245 620 225" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="660" y="260" text-anchor="middle" fill="#DC2626" font-size="10" font-weight="bold">WIFI_EVENT_</text>
  <text x="660" y="274" text-anchor="middle" fill="#DC2626" font-size="10" font-weight="bold">STA_DISCONNECTED</text>

  <!-- Detailed Waveform / Timing Card -->
  <rect x="50" y="310" width="800" height="180" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="335" fill="#334155" font-size="13" font-weight="bold">สรุป Timing Diagram และการทำงานใน FreeRTOS led_status_task():</text>

  <!-- Waveform 1: DISCONNECTED -->
  <text x="70" y="370" fill="#B45309" font-size="11" font-weight="bold">Alert Pattern (DISCONNECTED):</text>
  <text x="270" y="370" fill="#64748B" font-size="11">(tick % 4 &lt; 2) ? 1 : 0 (tick เพิ่มทีละ 100ms)</text>
  <!-- Draw wave: 200ms HIGH, 200ms LOW, 200ms HIGH, 200ms LOW -->
  <path d="M 70 400 L 110 400 L 110 385 L 150 385 L 150 400 L 190 400 L 190 385 L 230 385 L 230 400 L 270 400" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="130" y="415" text-anchor="middle" fill="#92400E" font-size="10">200ms ติด</text>
  <text x="170" y="415" text-anchor="middle" fill="#92400E" font-size="10">200ms ดับ</text>

  <!-- Waveform 2: CONNECTED -->
  <text x="470" y="370" fill="#047857" font-size="11" font-weight="bold">Heartbeat Pattern (CONNECTED):</text>
  <text x="670" y="370" fill="#64748B" font-size="11">(tick % 10 &lt; 2) ? 1 : 0 (คาบ 1000ms)</text>
  <!-- Draw wave: 200ms HIGH, 800ms LOW -->
  <path d="M 470 400 L 490 400 L 490 385 L 530 385 L 530 400 L 690 400 L 690 385 L 730 385 L 730 400 L 750 400" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="510" y="415" text-anchor="middle" fill="#065F46" font-size="10">200ms ติด</text>
  <text x="610" y="415" text-anchor="middle" fill="#065F46" font-size="10">800ms ดับสนิท</text>
  <text x="710" y="415" text-anchor="middle" fill="#065F46" font-size="10">200ms ติด</text>

  <text x="70" y="460" fill="#475569" font-size="11">• เมื่อบอร์ดเพิ่งบูต: g_led_mode = LED_STA_OFF</text>
  <text x="70" y="478" fill="#475569" font-size="11">• เมื่อเริ่มต่อ Wi-Fi (STA_START / STA_DISCONNECTED): g_led_mode = LED_STA_DISCONNECTED</text>
  <text x="470" y="460" fill="#475569" font-size="11">• เมื่อได้ IP (STA_GOT_IP): g_led_mode = LED_STA_CONNECTED (Heartbeat)</text>
</svg>