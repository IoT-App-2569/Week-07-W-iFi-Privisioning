<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 620" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="2" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#374151"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="890" height="55" rx="8" fill="#1E293B" filter="url(#shadow)"/>
  <text x="475" y="44" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="bold">ผังขั้นตอนการตรวจสอบ PoP (Security Handshake Decision Flow)</text>
  <text x="475" y="62" text-anchor="middle" fill="#94A3B8" font-size="12">ใบงานที่ 7.4: การเปรียบเทียบ Security Schemes (Sec1 Curve25519 + AES-CTR) และ Custom Data</text>

  <!-- Step 1: Client Request -->
  <rect x="325" y="95" width="300" height="50" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="116" text-anchor="middle" fill="#1D4ED8" font-size="12" font-weight="bold">1. Client ร้องขอเปิด Session</text>
  <text x="475" y="133" text-anchor="middle" fill="#475569" font-size="11">ส่ง Client Public Key (Curve25519)</text>

  <line x1="475" y1="145" x2="475" y2="175" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Compute Secret -->
  <rect x="275" y="175" width="400" height="55" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="196" text-anchor="middle" fill="#1E293B" font-size="12" font-weight="bold">2. คำนวณ Shared Secret &amp; Session Key</text>
  <text x="475" y="214" text-anchor="middle" fill="#64748B" font-size="11">Shared Secret = ECDH() | ผสมค่า PoP: "abcd1234"</text>

  <line x1="475" y1="230" x2="475" y2="260" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Client Verification -->
  <rect x="275" y="260" width="400" height="55" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="281" text-anchor="middle" fill="#1E293B" font-size="12" font-weight="bold">3. Client ส่ง Verification Hash ตรวจสอบ PoP</text>
  <text x="475" y="299" text-anchor="middle" fill="#64748B" font-size="11">Client พิสูจน์ว่าตนเองมีค่า PoP ถูกต้องหรือไม่</text>

  <line x1="475" y1="315" x2="475" y2="345" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision: PoP Match? -->
  <polygon points="475,345 660,395 475,445 290,395" fill="#FEF3C7" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="388" text-anchor="middle" fill="#92400E" font-size="12" font-weight="bold">ค่า PoP ตรงกันหรือไม่ ?</text>
  <text x="475" y="405" text-anchor="middle" fill="#78350F" font-size="11">(Verification Hash Valid?)</text>

  <!-- Left: Invalid PoP -->
  <line x1="290" y1="395" x2="180" y2="395" stroke="#DC2626" stroke-width="2"/>
  <line x1="180" y1="395" x2="180" y2="475" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="215" y="388" fill="#DC2626" font-size="11" font-weight="bold">ไม่ตรง (ผิด)</text>

  <rect x="50" y="475" width="260" height="110" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="500" text-anchor="middle" fill="#B91C1C" font-size="12" font-weight="bold">❌ ปฏิเสธการเชื่อมต่อ (Reject)</text>
  <text x="180" y="520" text-anchor="middle" fill="#991B1B" font-size="10">SECURITY_SESSION_CREDENTIALS_MISMATCH</text>
  <text x="180" y="540" text-anchor="middle" fill="#475569" font-size="11">• Log: INVALID PoP / Unauthorized!</text>
  <text x="180" y="558" text-anchor="middle" fill="#DC2626" font-size="11">• ยุติ Session ทันที (ป้องกัน Brute Force)</text>

  <!-- Right: Valid PoP -->
  <line x1="660" y1="395" x2="770" y2="395" stroke="#059669" stroke-width="2"/>
  <line x1="770" y1="395" x2="770" y2="475" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="700" y="388" fill="#059669" font-size="11" font-weight="bold">ตรงกัน (ถูกต้อง)</text>

  <rect x="640" y="475" width="260" height="110" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="500" text-anchor="middle" fill="#047857" font-size="12" font-weight="bold">✅ เชื่อมต่อปลอดภัยสำเร็จ</text>
  <text x="770" y="520" text-anchor="middle" fill="#065F46" font-size="10">SECURITY_SESSION_SETUP_OK</text>
  <text x="770" y="540" text-anchor="middle" fill="#475569" font-size="11">• Log: Valid PoP! Secured Session OK!</text>
  <text x="770" y="558" text-anchor="middle" fill="#047857" font-size="11">• สร้าง AES-CTR Session Key เข้ารหัสข้อมูล</text>
</svg>