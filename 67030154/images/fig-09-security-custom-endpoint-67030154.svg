<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eef3ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#23304d" flood-opacity=".15"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#526581"/></marker><style>text{font-family:Segoe UI,Tahoma,sans-serif;fill:#17233c}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#5f6f89}.step{font-size:13px;font-weight:700;fill:#fff}.label{font-size:16px;font-weight:700}.small{font-size:13px;fill:#5f6f89}.edge{stroke:#526581;stroke-width:2.6;fill:none}.tag{font-size:12px;font-weight:700;fill:#526581}.foot{font-size:12px;fill:#7a8aa3}.box{stroke-width:2;filter:url(#shadow)}.blue{fill:#eef1ff;stroke:#6675e8}.green{fill:#eafaf3;stroke:#2aa876}.amber{fill:#fff6e3;stroke:#e2a12b}.red{fill:#fff0f0;stroke:#d55b6a}.purple{fill:#f5edff;stroke:#9b67d5}</style></defs><rect width="1200" height="700" fill="url(#bg)"/><text x="54" y="52" class="title">Security + Custom Endpoint Flow</text><text x="54" y="80" class="sub">PoP verification ต้องผ่านก่อนจึงจะรับ custom payload</text><line x1="54" y1="103" x2="1146" y2="103" stroke="#d9e1f0"/><g><rect x="70" y="225" width="220" height="92" rx="16" class="box blue"/><circle cx="98" cy="253" r="16" fill="#526581"/><text x="98" y="258" class="step" text-anchor="middle">1</text><text x="192" y="258" class="label" text-anchor="middle">Start session</text><text x="180" y="286" class="small" text-anchor="middle">client requests access</text></g><g><rect x="350" y="205" width="250" height="105" rx="16" class="box amber"/><circle cx="378" cy="233" r="16" fill="#526581"/><text x="378" y="238" class="step" text-anchor="middle">2</text><text x="487" y="238" class="label" text-anchor="middle">Verify PoP</text><text x="475" y="266" class="small" text-anchor="middle">ถูกต้องหรือไม่?</text></g><g><rect x="700" y="135" width="250" height="92" rx="16" class="box red"/><circle cx="728" cy="163" r="16" fill="#526581"/><text x="728" y="168" class="step" text-anchor="middle">3A</text><text x="837" y="168" class="label" text-anchor="middle">Reject session</text><text x="825" y="196" class="small" text-anchor="middle">credentials mismatch</text></g><g><rect x="700" y="330" width="250" height="92" rx="16" class="box purple"/><circle cx="728" cy="358" r="16" fill="#526581"/><text x="728" y="363" class="step" text-anchor="middle">3B</text><text x="837" y="363" class="label" text-anchor="middle">Custom endpoint</text><text x="825" y="391" class="small" text-anchor="middle">รับ payload ที่ตรวจแล้ว</text></g><g><rect x="1000" y="330" width="140" height="92" rx="16" class="box green"/><circle cx="1028" cy="358" r="16" fill="#526581"/><text x="1028" y="363" class="step" text-anchor="middle">4</text><text x="1082" y="363" class="label" text-anchor="middle">ACK</text><text x="1070" y="391" class="small" text-anchor="middle">status</text></g><path d="M 290 271 L 350 258" class="edge" marker-end="url(#arrow)"/><text x="328" y="256.5" class="tag">handshake</text><path d="M 600 235 L 700 181" class="edge" marker-end="url(#arrow)"/><text x="658" y="200" class="tag">ผิด</text><path d="M 600 285 L 700 376" class="edge" marker-end="url(#arrow)"/><text x="658" y="322.5" class="tag">ถูก</text><path d="M 950 376 L 1000 376" class="edge" marker-end="url(#arrow)"/><text x="983" y="368" class="tag">reply</text><text x="54" y="660" class="foot">Original flow redraw • Student 67030154</text><text x="1146" y="660" class="foot" text-anchor="end">Week 07 Wi-Fi Provisioning</text></svg>